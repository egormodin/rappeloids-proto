syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/datetime.proto";
import "rappeloids/v1/common.proto";

// Service managing canyons, technical routes, topos, and pitch information (AIP-121).
service CanyonsService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Lists canyons with pagination and optional region filter (AIP-132).
  rpc ListCanyons(ListCanyonsRequest) returns (ListCanyonsResponse) {
    option (google.api.http) = {
      get: "/v1/canyons"
      additional_bindings {
        get: "/v1/{parent=regions/*}/canyons"
      }
    };
  }

  // Gets a single canyon by resource name (AIP-131).
  rpc GetCanyon(GetCanyonRequest) returns (Canyon) {
    option (google.api.http) = {
      get: "/v1/{name=canyons/*}"
      additional_bindings {
        get: "/v1/{name=regions/*/canyons/*}"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new canyon route (AIP-133). Requires authentication.
  rpc CreateCanyon(CreateCanyonRequest) returns (Canyon) {
    option (google.api.http) = {
      post: "/v1/canyons"
      body: "canyon"
      additional_bindings {
        post: "/v1/{parent=regions/*}/canyons"
        body: "canyon"
      }
    };
    option (google.api.method_signature) = "canyon,canyon_id";
  }

  // Updates an existing canyon route (AIP-134). Requires author or admin.
  rpc UpdateCanyon(UpdateCanyonRequest) returns (Canyon) {
    option (google.api.http) = {
      patch: "/v1/{canyon.name=canyons/*}"
      body: "canyon"
      additional_bindings {
        patch: "/v1/{canyon.name=regions/*/canyons/*}"
        body: "canyon"
      }
    };
    option (google.api.method_signature) = "canyon,update_mask";
  }

  // Deletes a canyon route (AIP-135). Requires author or admin.
  rpc DeleteCanyon(DeleteCanyonRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=canyons/*}"
      additional_bindings {
        delete: "/v1/{name=regions/*/canyons/*}"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Batch gets multiple canyons by resource name (AIP-231).
  rpc BatchGetCanyons(BatchGetCanyonsRequest) returns (BatchGetCanyonsResponse) {
    option (google.api.http) = {
      get: "/v1/canyons:batchGet"
    };
  }
}

// Canyon resource following AIP-122.
message Canyon {
  option (google.api.resource) = {
    type: "rappeloids.app/Canyon"
    pattern: "canyons/{canyon}"
    pattern: "regions/{region}/canyons/{canyon}"
    plural: "canyons"
    singular: "canyon"
  };

  // The resource name of the canyon.
  // Formats: "canyons/{canyon_id}" or "regions/{region_id}/canyons/{canyon_id}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The unique identifier of the canyon.
  string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Identifier of the region where this canyon is located.
  string region_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];

  // User-facing display title.
  string display_name = 4 [(google.api.field_behavior) = REQUIRED];

  // External reference or wiki link (e.g. Ropewiki).
  string link = 5 [(google.api.field_behavior) = OPTIONAL];

  // High-level description and beta summary.
  string description = 6 [(google.api.field_behavior) = OPTIONAL];

  // ACA technical rating (e.g. "3B III", "4C IV").
  string technical_rating = 7 [(google.api.field_behavior) = OPTIONAL];

  // ACA water rating ("A", "B", "C").
  string water_rating = 8 [(google.api.field_behavior) = OPTIONAL];

  // ACA time rating ("I", "II", "III", "IV", "V", "VI").
  string time_rating = 9 [(google.api.field_behavior) = OPTIONAL];

  // ACA risk rating (e.g. "R", "X", "PG-13").
  string risk_rating = 10 [(google.api.field_behavior) = OPTIONAL];

  // General difficulty label (e.g. "Intermediate", "Advanced").
  string difficulty = 11 [(google.api.field_behavior) = OPTIONAL];

  // Total count of rappels in the standard route.
  int32 rappels_count = 12 [(google.api.field_behavior) = OPTIONAL];

  // Maximum single rappel length in meters.
  double max_rappel_meters = 13 [(google.api.field_behavior) = OPTIONAL];

  // Total route time / duration.
  TotalTime total_time = 14 [(google.api.field_behavior) = OPTIONAL];

  // Recommended season or best months (e.g. "Summer", "Jul - Sep").
  string season = 15 [(google.api.field_behavior) = OPTIONAL];

  // Total route distance in kilometers.
  double distance_km = 17 [(google.api.field_behavior) = OPTIONAL];

  // Total elevation loss in meters.
  double elevation_drop_meters = 18 [(google.api.field_behavior) = OPTIONAL];

  // Total elevation gain in meters.
  double elevation_gain_meters = 19 [(google.api.field_behavior) = OPTIONAL];

  // Detailed route sections
  string overview = 20 [(google.api.field_behavior) = OPTIONAL];
  string approach = 21 [(google.api.field_behavior) = OPTIONAL];
  string descent = 22 [(google.api.field_behavior) = OPTIONAL];
  string exit = 23 [(google.api.field_behavior) = OPTIONAL];
  string red_tape = 24 [(google.api.field_behavior) = OPTIONAL];
  string permits = 25 [(google.api.field_behavior) = OPTIONAL];
  string shuttle = 26 [(google.api.field_behavior) = OPTIONAL];
  string vehicle = 27 [(google.api.field_behavior) = OPTIONAL];

  // User ID of the creator/author (AIP-122).
  string author_id = 31 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];

  message TotalTime {
    google.type.DateTime total_time = 1 [(google.api.field_behavior) = OPTIONAL];
    google.type.DateTime min_time = 2 [(google.api.field_behavior) = OPTIONAL];
    google.type.DateTime max_time = 3 [(google.api.field_behavior) = OPTIONAL];
  }

  message RappelPitch {
    string id = 1 [(google.api.field_behavior) = OPTIONAL];
    string name = 2 [(google.api.field_behavior) = REQUIRED];
    string length = 3 [(google.api.field_behavior) = OPTIONAL];
    string anchor = 4 [(google.api.field_behavior) = OPTIONAL];
    bool has_pool = 5 [(google.api.field_behavior) = OPTIONAL];
    int32 pools_count = 6 [(google.api.field_behavior) = OPTIONAL];
    string description = 7 [(google.api.field_behavior) = OPTIONAL];
    string section = 8 [(google.api.field_behavior) = OPTIONAL];
    bool is_alternative = 9 [(google.api.field_behavior) = OPTIONAL];
    string alt_of = 10 [(google.api.field_behavior) = OPTIONAL];
    bool is_staged = 11 [(google.api.field_behavior) = OPTIONAL];
    string staged_note = 12 [(google.api.field_behavior) = OPTIONAL];
    string escape_exit = 13 [(google.api.field_behavior) = OPTIONAL];
  }

  message CanyonLink {
    string title = 1 [(google.api.field_behavior) = REQUIRED];
    string url = 2 [(google.api.field_behavior) = REQUIRED];
  }

  message QualityRating {
    string source = 1 [(google.api.field_behavior) = REQUIRED];
    string value = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Collections
  repeated string gpx_track_ids = 32 [(google.api.field_behavior) = OPTIONAL];
  repeated RappelPitch pitches = 33 [(google.api.field_behavior) = OPTIONAL];
  repeated CanyonLink links = 34 [(google.api.field_behavior) = OPTIONAL];
  repeated QualityRating quality_ratings = 35 [(google.api.field_behavior) = OPTIONAL];
}

message ListCanyonsRequest {
  // Optional parent region: "regions/{region_id}"
  string parent = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];

  // Maximum items to return (AIP-158).
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous response (AIP-158).
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Region resource name or identifier (e.g. "regions/zion" or "zion").
  string region = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];

  // Sort order (AIP-132).
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListCanyonsResponse {
  repeated Canyon canyons = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message GetCanyonRequest {
  // Format: "canyons/{canyon_id}" or "regions/{region_id}/canyons/{canyon_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];
}

message CreateCanyonRequest {
  // Optional parent region: "regions/{region_id}"
  string parent = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];

  // Optional client-assigned ID.
  string canyon_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // The canyon resource to create.
  Canyon canyon = 3 [(google.api.field_behavior) = REQUIRED];
}

message UpdateCanyonRequest {
  // The canyon resource with updated fields.
  Canyon canyon = 1 [(google.api.field_behavior) = REQUIRED];

  // Field mask indicating which fields are to be updated (AIP-134).
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteCanyonRequest {
  // Format: "canyons/{canyon_id}" or "regions/{region_id}/canyons/{canyon_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];
}

message BatchGetCanyonsRequest {
  // List of canyon resource names (AIP-231).
  repeated string names = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];
}

message BatchGetCanyonsResponse {
  repeated Canyon canyons = 1;
}
