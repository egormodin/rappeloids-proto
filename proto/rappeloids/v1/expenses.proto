syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "rappeloids/v1/common.proto";

// Service managing shared group expenses and debt settlements for trips (AIP-121).
service ExpensesService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Lists expenses for a trip with pagination (AIP-132).
  rpc ListExpenses(ListExpensesRequest) returns (ListExpensesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=trips/*}/expenses"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets a single expense by resource name (AIP-131).
  rpc GetExpense(GetExpenseRequest) returns (Expense) {
    option (google.api.http) = {
      get: "/v1/{name=trips/*/expenses/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new trip expense (AIP-133). Requires participant.
  rpc CreateExpense(CreateExpenseRequest) returns (Expense) {
    option (google.api.http) = {
      post: "/v1/{parent=trips/*}/expenses"
      body: "expense"
    };
    option (google.api.method_signature) = "parent,expense,expense_id";
  }

  // Updates an expense (AIP-134). Requires payer or organizer.
  rpc UpdateExpense(UpdateExpenseRequest) returns (Expense) {
    option (google.api.http) = {
      patch: "/v1/{expense.name=trips/*/expenses/*}"
      body: "expense"
    };
    option (google.api.method_signature) = "expense,update_mask";
  }

  // Deletes an expense (AIP-135). Requires payer or organizer.
  rpc DeleteExpense(DeleteExpenseRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=trips/*/expenses/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Gets calculated debt and spending summary for a trip (AIP-136).
  rpc GetTripExpenseSummary(GetTripExpenseSummaryRequest) returns (TripExpenseSummary) {
    option (google.api.http) = {
      get: "/v1/{name=trips/*}/expenseSummary"
    };
    option (google.api.method_signature) = "name";
  }
}

// Expense resource following AIP-122.
message Expense {
  option (google.api.resource) = {
    type: "rappeloids.app/Expense"
    pattern: "trips/{trip}/expenses/{expense}"
    plural: "expenses"
    singular: "expense"
  };

  // Resource name: "trips/{trip_id}/expenses/{expense_id}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The unique identifier of the expense.
  string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Parent trip ID.
  string trip_id = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];

  // Short title of the expense.
  string title = 4 [(google.api.field_behavior) = REQUIRED];

  // User ID who paid for this expense.
  string payer_id = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];

  // Monetary amount and currency (AIP-213).
  Money amount = 6 [(google.api.field_behavior) = REQUIRED];

  // Category label (e.g. "gas", "lodging", "food", "permits").
  string category = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional notes and description.
  string description = 8 [(google.api.field_behavior) = OPTIONAL];

  // Uploaded receipt photo URL.
  string receipt_url = 9 [(google.api.field_behavior) = OPTIONAL];

  // User splits and owed amounts.
  repeated ExpenseSplit splits = 10 [(google.api.field_behavior) = OPTIONAL];

  // Timestamp when the expense was created (AIP-142).
  google.protobuf.Timestamp create_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Timestamp when the expense was last updated (AIP-142).
  google.protobuf.Timestamp update_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ExpenseSplit {
  string user_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];
  Money amount = 2 [(google.api.field_behavior) = REQUIRED];
  bool is_settled = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ExpenseBalance {
  string user_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];
  string user_name = 2 [(google.api.field_behavior) = OPTIONAL];
  Money net_balance = 3 [(google.api.field_behavior) = REQUIRED];
}

message TripExpenseSummary {
  string trip_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];
  Money total_spent = 2 [(google.api.field_behavior) = REQUIRED];
  repeated ExpenseBalance balances = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListExpensesRequest {
  // Parent trip resource name: "trips/{trip_id}"
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListExpensesResponse {
  repeated Expense expenses = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message GetExpenseRequest {
  // Format: "trips/{trip_id}/expenses/{expense_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Expense"
  ];
}

message CreateExpenseRequest {
  // Parent trip resource name: "trips/{trip_id}"
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];
  string expense_id = 2 [(google.api.field_behavior) = OPTIONAL];
  Expense expense = 3 [(google.api.field_behavior) = REQUIRED];
}

message UpdateExpenseRequest {
  Expense expense = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteExpenseRequest {
  // Format: "trips/{trip_id}/expenses/{expense_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Expense"
  ];
}

message GetTripExpenseSummaryRequest {
  // Parent trip resource name: "trips/{trip_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];
}
