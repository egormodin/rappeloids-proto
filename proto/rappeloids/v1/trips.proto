syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/datetime.proto";
import "google/type/interval.proto";

// Service managing canyoneering expeditions, itineraries, and participant tracking (AIP-121).
service TripsService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Lists trips with pagination (AIP-132).
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse) {
    option (google.api.http) = {
      get: "/v1/trips"
    };
  }

  // Gets a single trip by resource name (AIP-131).
  rpc GetTrip(GetTripRequest) returns (Trip) {
    option (google.api.http) = {
      get: "/v1/{name=trips/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new trip (AIP-133). Creator becomes organizer.
  rpc CreateTrip(CreateTripRequest) returns (Trip) {
    option (google.api.http) = {
      post: "/v1/trips"
      body: "trip"
    };
    option (google.api.method_signature) = "trip";
  }

  // Updates an existing trip (AIP-134). Requires organizer or admin.
  rpc UpdateTrip(UpdateTripRequest) returns (Trip) {
    option (google.api.http) = {
      patch: "/v1/{trip.name=trips/*}"
      body: "trip"
    };
    option (google.api.method_signature) = "trip,update_mask";
  }

  // Deletes a trip (AIP-135). Requires organizer or admin.
  rpc DeleteTrip(DeleteTripRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=trips/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

// Trip resource following AIP-122.
message Trip {
  option (google.api.resource) = {
    type: "rappeloids.app/Trip"
    pattern: "trips/{trip}"
    plural: "trips"
    singular: "trip"
  };

  // Status of the trip expedition.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    PLANNED = 1;
    IN_PROGRESS = 2;
    FINISHED = 3;
    CANCELLED = 4;
  }

  // Resource name: "trips/{trip_id}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Title of the trip.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // Detailed description and trip plan notes.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Primary region of the trip.
  string region_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];

  // Status of the trip expedition.
  Status status = 5 [(google.api.field_behavior) = OPTIONAL];

  // Creator / owner user of the trip. Format: "users/{user_id}".
  string creator = 6 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];

  // Trip participants and their roles.
  repeated TripParticipant participants = 7 [(google.api.field_behavior) = OPTIONAL];

  // Multi-day itinerary schedule.
  repeated TripStep itinerary_steps = 8 [(google.api.field_behavior) = OPTIONAL];

  // Trip discussion and log notes.
  repeated TripNote notes = 9 [(google.api.field_behavior) = OPTIONAL];

  // Dates description for the trip (e.g. "Jun 15 - Jun 22, 2026").
  string dates = 10 [(google.api.field_behavior) = REQUIRED];
}

message TripParticipant {
  // Participation status in the trip.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    PENDING = 1;
    APPROVED = 2;
    REJECTED = 3;
    TWICE_REJECTED = 4;
  }

  // User resource name ("users/{user_id}").
  string user = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];
  Status status = 2 [(google.api.field_behavior) = OPTIONAL];
}

message TripStep {
  string id = 1 [(google.api.field_behavior) = OPTIONAL];
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  int32 sort_order = 3 [(google.api.field_behavior) = OPTIONAL];

  oneof step_type {
    CanyonStep canyon = 4;
    TravelStep travel = 5;
    LodgingStep lodging = 6;
  }
}

message CanyonStep {
  string canyon = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];
  google.type.DateTime scheduled_date = 2 [(google.api.field_behavior) = OPTIONAL];
  google.type.Interval planned_duration = 3 [(google.api.field_behavior) = OPTIONAL];
  google.type.Interval drive_duration = 4 [(google.api.field_behavior) = OPTIONAL];
  google.type.Interval shuttle_duration = 5 [(google.api.field_behavior) = OPTIONAL];
  string notes = 6 [(google.api.field_behavior) = OPTIONAL];
}

message TravelStep {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    FLIGHT = 1;
    CAR = 2;
    TRAIN = 3;
    OTHER = 4;
  }

  Type type = 1 [(google.api.field_behavior) = REQUIRED];
  string departure_location = 2 [(google.api.field_behavior) = OPTIONAL];
  string arrival_location = 3 [(google.api.field_behavior) = OPTIONAL];
  google.type.DateTime departure_time = 4 [(google.api.field_behavior) = OPTIONAL];
  google.type.DateTime arrival_time = 5 [(google.api.field_behavior) = OPTIONAL];
  string notes = 6 [(google.api.field_behavior) = OPTIONAL];
}

message LodgingStep {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    CAMPING = 1;
    HOTEL = 2;
    AIRBNB = 3;
    OTHER = 4;
  }

  Type type = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string location = 3 [(google.api.field_behavior) = OPTIONAL];
  google.type.DateTime start_time = 4 [(google.api.field_behavior) = OPTIONAL];
  google.type.DateTime end_time = 5 [(google.api.field_behavior) = OPTIONAL];
}

// TripNote resource representing a note/comment on a trip.
message TripNote {
  option (google.api.resource) = {
    type: "rappeloids.app/TripNote"
    pattern: "trips/{trip}/notes/{note}"
    plural: "tripNotes"
    singular: "tripNote"
  };

  // Resource name: "trips/{trip}/notes/{note}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string author = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];
  string text = 3 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListTripsRequest {}

message ListTripsResponse {
  repeated Trip trips = 1;
}

message GetTripRequest {
  // Format: "trips/{trip_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];
}

message CreateTripRequest {
  Trip trip = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateTripRequest {
  Trip trip = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteTripRequest {
  // Format: "trips/{trip_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];
}
