syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/type/date.proto";
import "google/type/datetime.proto";

// Geographic point representing latitude, longitude, and optional elevation.
message GeoPoint {
  // Latitude in degrees. Must be in the range [-90.0, +90.0].
  double latitude = 1 [(google.api.field_behavior) = REQUIRED];

  // Longitude in degrees. Must be in the range [-180.0, +180.0].
  double longitude = 2 [(google.api.field_behavior) = REQUIRED];

  // Altitude above sea level in meters.
  double elevation_meters = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Price specification with amount and currency code.
message Price {
  // Monetary amount.
  double amount = 1 [(google.api.field_behavior) = OPTIONAL];

  // The 3-letter currency code defined in ISO 4217 (e.g. "USD", "EUR"). Defaults to "USD".
  string currency_code = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Monetary value with standard 3-letter currency code and units/nanos split (AIP-213).
message Money {
  // The 3-letter currency code defined in ISO 4217 (e.g. "USD", "EUR").
  string currency_code = 1 [(google.api.field_behavior) = REQUIRED];

  // The whole units of the amount.
  int64 units = 2 [(google.api.field_behavior) = REQUIRED];

  // Number of nano (10^-9) units of the amount.
  int32 nanos = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Schedule or duration specification for a travel route.
message RouteSchedule {
  // Specific departure and arrival date and time.
  message ExactTimes {
    // Exact departure date and time.
    google.type.DateTime departure_time = 1 [(google.api.field_behavior) = OPTIONAL];

    // Exact arrival date and time.
    google.type.DateTime arrival_time = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // Schedule specification choice.
  oneof schedule {
    // Specific departure and arrival date and time.
    ExactTimes exact_times = 1;

    // Estimated travel duration.
    google.protobuf.Duration duration = 2;
  }
}

// Duration specification supporting exact calendar dates or flexible text with duration.
message Duration {
  // Exact start and end calendar dates.
  message ExactDates {
    // Start calendar date.
    google.type.Date start_date = 1 [(google.api.field_behavior) = REQUIRED];

    // End calendar date.
    google.type.Date end_date = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Flexible date text with duration.
  message TextDuration {
    // Text description of dates (e.g. "Jun 15 - Jun 22, 2026", "Late August").
    string dates = 1 [(google.api.field_behavior) = REQUIRED];

    // Duration of the trip or trips group.
    google.protobuf.Duration duration = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // Duration specification choice.
  oneof duration {
    // Specific calendar start and end dates.
    ExactDates exact_dates = 1;

    // Flexible date text with optional duration.
    TextDuration text_duration = 2;
  }
}
