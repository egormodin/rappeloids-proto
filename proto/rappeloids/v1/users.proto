syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

// Service managing user accounts, authentication profiles, and preferences (AIP-121).
service UsersService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Gets a user profile by resource name (AIP-131).
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/{name=users/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Gets the profile of the currently authenticated caller.
  rpc GetMyProfile(google.protobuf.Empty) returns (User) {
    option (google.api.http) = {
      get: "/v1/users:me"
    };
  }

  // Updates a user profile (AIP-134). Requires self or admin.
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/v1/{user.name=users/*}"
      body: "user"
    };
    option (google.api.method_signature) = "user,update_mask";
  }

  // Lists users with pagination (AIP-132).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }
}

// User profile resource following AIP-122.
message User {
  option (google.api.resource) = {
    type: "rappeloids.app/User"
    pattern: "users/{user}"
    plural: "users"
    singular: "user"
  };

  // Assigned security role.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_USER = 1;
    ROLE_ADMIN = 2;
  }

  // Theme preference.
  enum Theme {
    THEME_UNSPECIFIED = 0;
    DARK = 1;
    LIGHT = 2;
  }

  // UI Accent Color Scheme.
  enum ColorScheme {
    COLOR_SCHEME_UNSPECIFIED = 0;
    OCEAN = 1;
    SEDONA = 2;
    ALPINE = 3;
    GLACIER = 4;
    SUNSET = 5;
    CYBER = 6;
    MONOCHROME = 7;
    NORDIC = 8;
    SAHARA = 9;
    AMAZON = 10;
    LAVENDER = 11;
    VOLCANO = 12;
    CHERRY = 13;
    SAPPHIRE = 14;
    EMERALD = 15;
    COFFEE = 16;
    AUTUMN = 17;
    MIDNIGHT = 18;
    CORAL = 19;
    NORTHERN_AURORA = 20;
    INDIGO = 21;
    CANYON_AMBER = 22;
    SLATE_BLUE = 23;
    DESERT_SAGE = 24;
    PLUM_VELVET = 25;
  }

  // Unit measurement system.
  enum UnitSystem {
    UNIT_SYSTEM_UNSPECIFIED = 0;
    IMPERIAL = 1;
    METRIC = 2;
  }

  // Resource name: "users/{user_id}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Email address of the user.
  string email = 3 [(google.api.field_behavior) = REQUIRED];

  // Display name.
  string display_name = 4 [(google.api.field_behavior) = REQUIRED];

  // Profile avatar photo URL.
  string avatar_url = 5 [(google.api.field_behavior) = OPTIONAL];

  // Assigned security role.
  Role role = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether user is approved by an administrator.
  bool approved = 7 [(google.api.field_behavior) = OPTIONAL];

  // Secondary email address for authentication and profile resolution.
  string secondary_email = 8 [(google.api.field_behavior) = OPTIONAL];

  // Dark or Light theme.
  Theme theme = 9 [(google.api.field_behavior) = OPTIONAL];

  // Accent color scheme.
  ColorScheme color_scheme = 10 [(google.api.field_behavior) = OPTIONAL];

  // Whether user is hidden in history views.
  bool is_hidden_in_history = 11 [(google.api.field_behavior) = OPTIONAL];

  // Unit measurement system.
  UnitSystem unit_system = 12 [(google.api.field_behavior) = OPTIONAL];
}

message GetUserRequest {
  // Format: "users/{user_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];
}

message UpdateUserRequest {
  User user = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}
