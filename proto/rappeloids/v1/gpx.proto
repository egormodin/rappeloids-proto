syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/type/latlng.proto";
import "rappeloids/v1/common.proto";

// Service managing GPX tracks and routes.
service GpxService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Queries GPX tracks for a canyon, region, or specific track (AIP-136).
  rpc QueryGpxTracks(QueryGpxTracksRequest) returns (QueryGpxTracksResponse) {
    option (google.api.http) = {
      get: "/v1/gpxTracks:query"
      additional_bindings {
        get: "/v1/{canyon=canyons/*}/gpxTracks:query"
      }
      additional_bindings {
        get: "/v1/{region=regions/*}/gpxTracks:query"
      }
      additional_bindings {
        get: "/v1/{name=canyons/*/gpxTracks/*}:query"
      }
    };
  }

  // Uploads and parses a raw track file (GPX, KML, or KMZ) to create a new track (AIP-136).
  rpc UploadGpxTrack(UploadGpxTrackRequest) returns (GpxTrack) {
    option (google.api.http) = {
      post: "/v1/{parent=canyons/*}/gpxTracks:upload"
      body: "*"
    };
    option (google.api.method_signature) = "parent,file_content,file_name";
  }

  // Downloads a GPX track in raw GPX, KML, or KMZ format (AIP-136).
  rpc DownloadGpxTrack(DownloadGpxTrackRequest) returns (DownloadGpxTrackResponse) {
    option (google.api.http) = {
      get: "/v1/{name=canyons/*/gpxTracks/*}:download"
    };
    option (google.api.method_signature) = "name";
  }

  // Updates an existing GPX track (AIP-134).
  rpc UpdateGpxTrack(UpdateGpxTrackRequest) returns (GpxTrack) {
    option (google.api.http) = {
      patch: "/v1/{gpx_track.name=canyons/*/gpxTracks/*}"
      body: "gpx_track"
    };
    option (google.api.method_signature) = "gpx_track,update_mask";
  }

  // Deletes a GPX track (AIP-135).
  rpc DeleteGpxTrack(DeleteGpxTrackRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=canyons/*/gpxTracks/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

// A continuous track segment or discrete path (e.g., Approach, Descent, Exit).
message Segment {
  // Classification of the segment.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    APPROACH = 1;    // Hike to the start of the canyon
    DESCENT = 2;     // Technical section (rappels, narrows, swims)
    EXIT = 3;        // Hike/climb out from the bottom
    SHUTTLE = 4;     // Vehicle shuttle or drive route
    ESCAPE = 5;      // Emergency escape / bailout route
    ALTERNATIVE = 6; // Alternate route / bypass
    OTHER = 7;
  }

  // Name or label of the segment (e.g., "Approach Trail", "Main Descent", "Sneak Exit").
  string name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional description or notes for this segment.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];

  // Semantic segment type.
  Type type = 3 [(google.api.field_behavior) = OPTIONAL];

  // Custom type string if not covered by enum.
  string custom_type = 4 [(google.api.field_behavior) = OPTIONAL];

  // Display color preference (e.g., hex "#FF0000" or named color "Red").
  string display_color = 5 [(google.api.field_behavior) = OPTIONAL];

  // Ordered points forming this segment line.
  repeated GeoPoint points = 6 [(google.api.field_behavior) = REQUIRED];

  // Pre-calculated stats for this segment.
  optional TrackStats stats = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Waypoints / POIs associated with this segment.
  repeated Waypoint waypoints = 8 [(google.api.field_behavior) = OPTIONAL];
}

// A standalone point of interest / POI (e.g., Trailhead, R1, Anchor, Spring, Car Drop).
message Waypoint {
  // Classification of the waypoint.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TRAILHEAD = 1;      // Parking / Trailhead
    RAPPEL = 2;         // Rappel anchor / drop
    WATER = 3;          // Spring, pool, water source
    JUNCTION = 4;       // Trail fork / canyon confluence
    OBSTACLE = 5;       // Downclimb, keeper pothole, boulder choke
    EXIT_POINT = 6;     // Start of exit hike / scramble
    VEHICLE_DROP = 7;   // Shuttle drop / exit vehicle
    DANGER = 8;         // Siphon, flash flood refuge, rockfall hazard
    CAMP = 9;           // Campsite / bivouac
    OTHER = 10;
  }

  // 3D geographic point and elevation.
  GeoPoint point = 1 [(google.api.field_behavior) = REQUIRED];

  // Name/label (e.g. "R1 (25m)", "Trailhead Parking", "Exit Couloir").
  string name = 2 [(google.api.field_behavior) = REQUIRED];

  // Detailed description (e.g. "Bolted anchor on canyon right, 25m drop into pool").
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Waypoint category/type.
  Type type = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Pre-computed geographic summary & elevation profile stats.
message TrackStats {
  // Total 2D / 3D distance in meters.
  double total_distance_meters = 1;

  // Cumulative elevation gain in meters.
  double elevation_gain_meters = 2;

  // Cumulative elevation loss in meters.
  double elevation_loss_meters = 3;

  // Minimum elevation recorded in meters.
  double min_elevation_meters = 4;

  // Maximum elevation recorded in meters.
  double max_elevation_meters = 5;
}

// Geographic bounding box enclosing all points in the dataset.
message GeoBounds {
  // Southwest corner (minimum latitude and minimum longitude).
  google.type.LatLng south_west = 1 [(google.api.field_behavior) = REQUIRED];

  // Northeast corner (maximum latitude and maximum longitude).
  google.type.LatLng north_east = 2 [(google.api.field_behavior) = REQUIRED];
}

// Track creation source or origin (AIP-126).
enum GpxTrackOrigin {
  // Unspecified track origin.
  GPX_TRACK_ORIGIN_UNSPECIFIED = 0;

  // Synthesized or constructed algorithmically / AI.
  GPX_TRACK_ORIGIN_AI_CONSTRUCTED = 1;

  // Imported or uploaded from external GPX, KML, or KMZ file.
  GPX_TRACK_ORIGIN_UPLOADED = 2;

  // Created or modified by manual user edit.
  GPX_TRACK_ORIGIN_MANUAL_EDIT = 3;
}

// GPX track resource following AIP-122.
message GpxTrack {
  option (google.api.resource) = {
    type: "rappeloids.app/GpxTrack"
    pattern: "canyons/{canyon}/gpxTracks/{gpx_track}"
    plural: "gpxTracks"
    singular: "gpxTrack"
  };

  // The resource name of the GPX track (e.g. "canyons/{canyon}/gpxTracks/{gpx_track}").
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Name or title of the track (e.g. "Main Route", "Approach").
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Raw GPX XML string content (kept for backward compatibility during migration).
  string gpx_content = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether this is the default track for the canyon.
  bool is_default = 4 [(google.api.field_behavior) = OPTIONAL];

  // How this track was constructed / created.
  GpxTrackOrigin origin = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional description or note for the track.
  string description = 6 [(google.api.field_behavior) = OPTIONAL];

  // Author or contributor of the GPX track.
  string author = 7 [(google.api.field_behavior) = OPTIONAL];

  // Waypoints / POIs extracted from the GPX.
  repeated Waypoint waypoints = 8 [(google.api.field_behavior) = OPTIONAL];

  // Path segments extracted from the GPX.
  repeated Segment segments = 9 [(google.api.field_behavior) = OPTIONAL];

  // Aggregate summary stats calculated across all segments.
  optional TrackStats summary_stats = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Geographic bounding box for instant map fitting.
  optional GeoBounds bounds = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message QueryGpxTracksRequest {
  oneof target {
    // Canyon resource name: "canyons/{canyon_id}"
    string canyon = 1 [(google.api.resource_reference).type = "rappeloids.app/Canyon"];

    // Region resource name: "regions/{region_id}" (queries default tracks for canyons in region)
    string region = 2 [(google.api.resource_reference).type = "rappeloids.app/Region"];

    // GPX Track resource name: "canyons/{canyon_id}/gpxTracks/{gpx_track_id}"
    string name = 3 [(google.api.resource_reference).type = "rappeloids.app/GpxTrack"];
  }
}

message QueryGpxTracksResponse {
  repeated GpxTrack tracks = 1;
}

// Request message for UploadGpxTrack (AIP-136).
message UploadGpxTrackRequest {
  // Supported file formats for raw upload.
  enum Format {
    FORMAT_UNSPECIFIED = 0;
    GPX = 1; // Standard GPX (.gpx) XML format
    KML = 2; // Google Earth Keyhole Markup Language (.kml) XML format
    KMZ = 3; // Zipped KML (.kmz) binary archive
  }

  // The parent canyon resource name (e.g. "canyons/{canyon}").
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];

  // The raw file content (bytes for GPX, KML, or compressed KMZ).
  bytes file_content = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional original filename (e.g. "approach_route.gpx", "canyon.kml", "track.kmz").
  string file_name = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional format hint (if omitted, format is inferred from file_name or content).
  Format format = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional display name override for the track.
  string display_name = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional description or beta for the track.
  string description = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional author attribution.
  string author = 7 [(google.api.field_behavior) = OPTIONAL];

  // Whether this track should be set as the default track for the canyon.
  bool is_default = 8 [(google.api.field_behavior) = OPTIONAL];

  // How this track was constructed / created (defaults to GPX_TRACK_ORIGIN_UPLOADED if unspecified).
  GpxTrackOrigin origin = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DownloadGpxTrack (AIP-136).
message DownloadGpxTrackRequest {
  // Format for export / download.
  enum Format {
    FORMAT_UNSPECIFIED = 0;
    GPX = 1; // Standard GPX (.gpx) XML format
    KML = 2; // Google Earth Keyhole Markup Language (.kml) XML format
    KMZ = 3; // Zipped KML (.kmz) binary archive
  }

  // The resource name of the GPX track to download (e.g. "canyons/{canyon}/gpxTracks/{gpx_track}").
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/GpxTrack"
  ];

  // Desired export format. Defaults to GPX if unspecified.
  Format format = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for DownloadGpxTrack (AIP-136).
message DownloadGpxTrackResponse {
  // Filename suitable for download (e.g. "canyon_name_main_track.gpx").
  string file_name = 1;

  // MIME type (e.g. "application/gpx+xml", "application/vnd.google-earth.kml+xml", "application/vnd.google-earth.kmz").
  string mime_type = 2;

  // Raw file bytes.
  bytes file_content = 3;
}

message UpdateGpxTrackRequest {
  // The GPX track resource with updated fields.
  GpxTrack gpx_track = 1 [(google.api.field_behavior) = REQUIRED];

  // Field mask indicating which fields are to be updated (AIP-134).
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteGpxTrackRequest {
  // Format: "canyons/{canyon_id}/gpxTracks/{gpx_track_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/GpxTrack"
  ];
}
