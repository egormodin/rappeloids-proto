syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/type/date.proto";

// Service managing historical canyon descent logs and expedition history (AIP-121).
service HistoryService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Lists historical canyon descent records grouped into trips with user participation, optionally filtered by year (AIP-132).
  rpc ListHistoryTrips(ListHistoryTripsRequest) returns (ListHistoryTripsResponse) {
    option (google.api.http) = {
      get: "/v1/historyTrips"
    };
  }

  // Lists available years that have historical descent records for UI navigation (AIP-136).
  rpc ListHistoryYears(ListHistoryYearsRequest) returns (ListHistoryYearsResponse) {
    option (google.api.http) = {
      get: "/v1/historyYears"
    };
  }

  // Atomically applies batch updates/inserts/deletions to history descents, trips, and participant statuses.
  rpc BatchUpdateHistoryTrips(BatchUpdateHistoryTripsRequest) returns (BatchUpdateHistoryTripsResponse) {
    option (google.api.http) = {
      post: "/v1/historyTrips:batchUpdate"
      body: "*"
    };
  }
}

// HistoryTrip resource representing an outing/expedition containing one or more historical canyon descents.
message HistoryTrip {
  option (google.api.resource) = {
    type: "rappeloids.app/HistoryTrip"
    pattern: "historyTrips/{history_trip}"
    plural: "historyTrips"
    singular: "historyTrip"
  };

  // Resource name: "historyTrips/{history_trip}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional photo album link for the trip.
  string photos_link = 2 [(google.api.field_behavior) = OPTIONAL];

  // The canyon descent entries belonging to this trip.
  repeated HistoryEntry entries = 3 [(google.api.field_behavior) = OPTIONAL];
}

// HistoryEntry resource representing a single canyon descent within a history trip.
message HistoryEntry {
  option (google.api.resource) = {
    type: "rappeloids.app/HistoryEntry"
    pattern: "historyTrips/{history_trip}/historyEntries/{history_entry}"
    plural: "historyEntries"
    singular: "historyEntry"
  };

  // Resource name: "historyTrips/{history_trip}/historyEntries/{history_entry}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Canyon resource name: "canyons/{canyon}"
  string canyon = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];

  // Human-readable canyon name.
  string canyon_name = 3 [(google.api.field_behavior) = OPTIONAL];

  // Date of descent.
  google.type.Date date = 4 [(google.api.field_behavior) = OPTIONAL];

  // Ordering of canyon within the same trip and on the same date.
  int32 order = 5 [(google.api.field_behavior) = OPTIONAL];

  // Map of participant user ID -> descent status.
  map<string, string> user_statuses = 6 [(google.api.field_behavior) = OPTIONAL];
}

message ListHistoryTripsRequest {
  // Optional year to filter historical descent records (e.g. 2026). If omitted, returns summary/all records.
  optional int32 year = 1 [(google.api.field_behavior) = OPTIONAL];
}

message ListHistoryTripsResponse {
  // Historical trips with their nested canyon descent entries.
  repeated HistoryTrip trips = 1;
}

message HistoryYearSummary {
  // The year (e.g. 2026).
  int32 year = 1;

  // Number of canyons (historical descents) in this year.
  int32 canyon_count = 2;
}

message ListHistoryYearsRequest {}

message ListHistoryYearsResponse {
  repeated HistoryYearSummary year_summaries = 1;
}

message BatchUpdateHistoryTripsRequest {
  // Trips containing their canyon descent entries (including single-entry trips).
  repeated HistoryTrip trips = 1 [(google.api.field_behavior) = OPTIONAL];

  // Resource names of history entries to delete (e.g. "historyTrips/{history_trip}/historyEntries/{history_entry}").
  repeated string delete_names = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/HistoryEntry"
  ];
}

message BatchUpdateHistoryTripsResponse {
  // Resulting/updated history trips with their entries (AIP-234).
  repeated HistoryTrip trips = 1;
}
