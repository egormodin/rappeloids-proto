syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/type/date.proto";

// Service managing historical canyon descent logs and expedition history (AIP-121).
service HistoryService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Lists historical canyon descent records with user participation, optionally filtered by year (AIP-132).
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/history"
    };
  }

  // Lists available years that have historical descent records for UI navigation (AIP-136).
  rpc ListHistoryYears(ListHistoryYearsRequest) returns (ListHistoryYearsResponse) {
    option (google.api.http) = {
      get: "/v1/history:listYears"
    };
  }

  // Atomically applies batch updates/inserts/deletions to history descents, trips, and participant statuses.
  rpc BatchUpdateHistory(BatchUpdateHistoryRequest) returns (BatchUpdateHistoryResponse) {
    option (google.api.http) = {
      post: "/v1/history:batchUpdate"
      body: "*"
    };
  }
}

// HistoryEntry resource following AIP-122.
message HistoryEntry {
  option (google.api.resource) = {
    type: "rappeloids.app/HistoryEntry"
    pattern: "history/{history_entry}"
    plural: "historyEntries"
    singular: "historyEntry"
  };

  // Resource name: "history/{history_entry}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Associated trip ID if grouped.
  string trip_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Canyon resource name: "canyons/{canyon}"
  string canyon = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];

  // Human-readable canyon name.
  string canyon_name = 4 [(google.api.field_behavior) = OPTIONAL];

  // Date of descent.
  google.type.Date date = 5 [(google.api.field_behavior) = OPTIONAL];

  // Ordering of canyon within the trip.
  int32 order = 6 [(google.api.field_behavior) = OPTIONAL];

  // Map of participant user ID -> descent status.
  map<string, string> user_statuses = 7 [(google.api.field_behavior) = OPTIONAL];
}

message ListHistoryRequest {
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional year to filter historical descent records (e.g. 2026). If omitted, returns summary/all records.
  optional int32 year = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListHistoryResponse {
  repeated HistoryEntry entries = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message ListHistoryYearsRequest {}

message ListHistoryYearsResponse {
  repeated int32 years = 1;
}

message HistoryEntryUpdate {
  // Resource name: "history/{history_entry}". Leave empty when creating a new descent entry.
  string name = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/HistoryEntry"
  ];

  // Canyon resource name: "canyons/{canyon}"
  string canyon = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];

  // Date of descent.
  google.type.Date date = 3 [(google.api.field_behavior) = OPTIONAL];

  // Ordering of canyon within the trip.
  int32 order = 4 [(google.api.field_behavior) = OPTIONAL];

  // Map of participant user ID -> descent status ("passed", "planned", etc.).
  map<string, string> user_statuses = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Group of canyon descents belonging to the same trip/outing.
message HistoryTripUpdate {
  // Existing trip ID. If creating a new trip, leave empty and the server will assign a new trip ID for this group.
  string trip_id = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional photo album link for the trip.
  string photos_link = 2 [(google.api.field_behavior) = OPTIONAL];

  // The canyon descents belonging to this trip.
  repeated HistoryEntryUpdate entries = 3 [(google.api.field_behavior) = REQUIRED];
}

message BatchUpdateHistoryRequest {
  // Trips containing their canyon descent entries (including single-entry trips).
  repeated HistoryTripUpdate trips = 1 [(google.api.field_behavior) = OPTIONAL];

  // Resource names of history entries to delete (e.g. "history/{history_entry}").
  repeated string delete_names = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/HistoryEntry"
  ];
}

message BatchUpdateHistoryResponse {
  // Resulting/updated history entries (AIP-234).
  repeated HistoryEntry entries = 1;
}
