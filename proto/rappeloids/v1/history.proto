syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

// Service managing historical canyon descent logs and expedition history (AIP-121).
service HistoryService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Lists historical canyon descent records with user participation, optionally filtered by year (AIP-132).
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/history"
    };
  }

  // Atomically applies batch updates/inserts/deletions to history descents, trips, and participant statuses.
  rpc BatchUpdateHistory(BatchUpdateHistoryRequest) returns (BatchUpdateHistoryResponse) {
    option (google.api.http) = {
      post: "/v1/history:batchUpdate"
      body: "*"
    };
  }
}

// HistoryEntry resource following AIP-122.
message HistoryEntry {
  option (google.api.resource) = {
    type: "rappeloids.app/HistoryEntry"
    pattern: "history/{history_entry}"
    plural: "historyEntries"
    singular: "historyEntry"
  };

  // Resource name: "history/{id}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The unique identifier of the history entry.
  string id = 2 [(google.api.field_behavior) = REQUIRED];

  // Associated trip ID if grouped.
  string trip_id = 3 [(google.api.field_behavior) = OPTIONAL];

  // Canyon ID (slug or uuid).
  string canyon_id = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];

  // Human-readable canyon name.
  string canyon_name = 5 [(google.api.field_behavior) = OPTIONAL];

  // Date of descent in YYYY-MM-DD format.
  string date = 6 [(google.api.field_behavior) = OPTIONAL];

  // Ordering of canyon within the trip.
  int32 order = 7 [(google.api.field_behavior) = OPTIONAL];

  // Map of participant user ID -> descent status.
  map<string, string> user_statuses = 8 [(google.api.field_behavior) = OPTIONAL];
}

message ListHistoryRequest {
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional year to filter historical descent records (e.g. 2026). If omitted, returns summary/all records.
  optional int32 year = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListHistoryResponse {
  repeated HistoryEntry entries = 1;
  repeated int32 available_years = 2;
  string next_page_token = 3;
  int32 total_size = 4;
}

message HistoryEntryUpdate {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string trip_id = 2 [(google.api.field_behavior) = OPTIONAL];
  string canyon_id = 3 [(google.api.field_behavior) = REQUIRED];
  string date = 4 [(google.api.field_behavior) = OPTIONAL];
  int32 order = 5 [(google.api.field_behavior) = OPTIONAL];
  map<string, string> user_statuses = 6 [(google.api.field_behavior) = OPTIONAL];
}

message BatchUpdateHistoryRequest {
  repeated HistoryEntryUpdate upserts = 1;
  repeated string delete_ids = 2;
}

message BatchUpdateHistoryResponse {
  int32 updated_count = 1;
  repeated HistoryEntry entries = 2;
}
