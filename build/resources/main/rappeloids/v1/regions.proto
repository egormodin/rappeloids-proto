syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.protos.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// Service managing geographic regions and canyon groupings (AIP-121).
service RegionsService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Lists regions with pagination (AIP-132).
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse) {
    option (google.api.http) = {
      get: "/v1/regions"
    };
  }

  // Gets a region by its resource name (AIP-131).
  rpc GetRegion(GetRegionRequest) returns (Region) {
    option (google.api.http) = {
      get: "/v1/{name=regions/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new region (AIP-133). Requires Administrator permissions.
  rpc CreateRegion(CreateRegionRequest) returns (Region) {
    option (google.api.http) = {
      post: "/v1/regions"
      body: "region"
    };
    option (google.api.method_signature) = "region,region_id";
  }

  // Updates an existing region (AIP-134). Requires Administrator permissions.
  rpc UpdateRegion(UpdateRegionRequest) returns (Region) {
    option (google.api.http) = {
      patch: "/v1/{region.name=regions/*}"
      body: "region"
    };
    option (google.api.method_signature) = "region,update_mask";
  }

  // Deletes a region (AIP-135). Requires Administrator permissions.
  rpc DeleteRegion(DeleteRegionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=regions/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

// Region resource representation following AIP-122.
message Region {
  option (google.api.resource) = {
    type: "rappeloids.app/Region"
    pattern: "regions/{region}"
    plural: "regions"
    singular: "region"
  };

  // The resource name of the region.
  // Format: "regions/{region_id}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The unique identifier of the region.
  string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // User-facing display name.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional resource name of the parent region (e.g. "regions/utah").
  string parent_region = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];

  // Whether region is visible in history views.
  bool history_visible = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListRegionsRequest {
  // Maximum number of items to return (AIP-158).
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous response (AIP-158).
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression (AIP-160).
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Order by field expression (AIP-132).
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListRegionsResponse {
  repeated Region regions = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message GetRegionRequest {
  // Format: "regions/{region_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];
}

message CreateRegionRequest {
  // Optional client-assigned ID.
  string region_id = 1 [(google.api.field_behavior) = OPTIONAL];

  // The region resource to create.
  Region region = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateRegionRequest {
  // The region resource with updated fields.
  Region region = 1 [(google.api.field_behavior) = REQUIRED];

  // Field mask indicating which fields are to be updated (AIP-134).
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteRegionRequest {
  // Format: "regions/{region_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];
}
