syntax = "proto3";

package rappeloids.v1;

option java_multiple_files = true;
option java_package = "app.rappeloids.v1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// Service managing canyoneering expeditions, itineraries, and participant tracking (AIP-121).
service TripsService {
  option (google.api.default_host) = "api.rappeloids.app";

  // Lists trips with pagination (AIP-132).
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse) {
    option (google.api.http) = {
      get: "/v1/trips"
    };
  }

  // Gets a single trip by resource name (AIP-131).
  rpc GetTrip(GetTripRequest) returns (Trip) {
    option (google.api.http) = {
      get: "/v1/{name=trips/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new trip (AIP-133). Creator becomes organizer.
  rpc CreateTrip(CreateTripRequest) returns (Trip) {
    option (google.api.http) = {
      post: "/v1/trips"
      body: "trip"
    };
    option (google.api.method_signature) = "trip,trip_id";
  }

  // Updates an existing trip (AIP-134). Requires organizer or admin.
  rpc UpdateTrip(UpdateTripRequest) returns (Trip) {
    option (google.api.http) = {
      patch: "/v1/{trip.name=trips/*}"
      body: "trip"
    };
    option (google.api.method_signature) = "trip,update_mask";
  }

  // Deletes a trip (AIP-135). Requires organizer or admin.
  rpc DeleteTrip(DeleteTripRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=trips/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  PLANNED = 1;
  IN_PROGRESS = 2;
  FINISHED = 3;
  CANCELLED = 4;
}

enum ParticipantStatus {
  PARTICIPANT_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  WAITING = 2;
  APPROVED = 3;
  REJECTED = 4;
  DISCOURAGED = 5;
}

// Trip resource following AIP-122.
message Trip {
  option (google.api.resource) = {
    type: "rappeloids.app/Trip"
    pattern: "trips/{trip}"
    plural: "trips"
    singular: "trip"
  };

  // Resource name: "trips/{trip_id}"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The unique identifier of the trip.
  string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Title of the trip.
  string title = 3 [(google.api.field_behavior) = REQUIRED];

  // Detailed description and trip plan notes.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Primary region of the trip.
  string region_id = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "rappeloids.app/Region"
  ];

  // Status of the trip expedition.
  TripStatus status = 6 [(google.api.field_behavior) = OPTIONAL];

  // Expedition start date.
  google.protobuf.Timestamp start_date = 7 [(google.api.field_behavior) = OPTIONAL];

  // Expedition end date.
  google.protobuf.Timestamp end_date = 8 [(google.api.field_behavior) = OPTIONAL];

  // Shared album link (e.g. Google Photos).
  string photos_link = 9 [(google.api.field_behavior) = OPTIONAL];

  // Trip participants and their roles.
  repeated TripParticipant participants = 10 [(google.api.field_behavior) = OPTIONAL];

  // Multi-day itinerary schedule.
  repeated TripStep itinerary_steps = 11 [(google.api.field_behavior) = OPTIONAL];

  // Trip discussion and log notes.
  repeated TripNote notes = 12 [(google.api.field_behavior) = OPTIONAL];

  // Timestamp when the trip was created (AIP-142).
  google.protobuf.Timestamp create_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Timestamp when the trip was last updated (AIP-142).
  google.protobuf.Timestamp update_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message TripParticipant {
  string user_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];
  string email = 3 [(google.api.field_behavior) = OPTIONAL];
  ParticipantStatus status = 4 [(google.api.field_behavior) = OPTIONAL];
  string role = 5 [(google.api.field_behavior) = OPTIONAL]; // "organizer", "member"
}

message TripStep {
  string id = 1 [(google.api.field_behavior) = OPTIONAL];
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  int32 sort_order = 3 [(google.api.field_behavior) = OPTIONAL];

  oneof step_type {
    CanyonStep canyon = 4;
    TravelStep travel = 5;
    LodgingStep lodging = 6;
  }
}

message CanyonStep {
  string canyon_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Canyon"
  ];
  google.protobuf.Timestamp scheduled_date = 2 [(google.api.field_behavior) = OPTIONAL];
  string planned_duration = 3 [(google.api.field_behavior) = OPTIONAL];
  string notes = 4 [(google.api.field_behavior) = OPTIONAL];
}

message TravelStep {
  string mode = 1 [(google.api.field_behavior) = REQUIRED]; // "flight", "car"
  string departure_location = 2 [(google.api.field_behavior) = OPTIONAL];
  string arrival_location = 3 [(google.api.field_behavior) = OPTIONAL];
  google.protobuf.Timestamp departure_time = 4 [(google.api.field_behavior) = OPTIONAL];
  google.protobuf.Timestamp arrival_time = 5 [(google.api.field_behavior) = OPTIONAL];
  string confirmation_code = 6 [(google.api.field_behavior) = OPTIONAL];
  string notes = 7 [(google.api.field_behavior) = OPTIONAL];
}

message LodgingStep {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string address = 2 [(google.api.field_behavior) = OPTIONAL];
  google.protobuf.Timestamp check_in = 3 [(google.api.field_behavior) = OPTIONAL];
  google.protobuf.Timestamp check_out = 4 [(google.api.field_behavior) = OPTIONAL];
  string confirmation_code = 5 [(google.api.field_behavior) = OPTIONAL];
}

message TripNote {
  string id = 1 [(google.api.field_behavior) = OPTIONAL];
  string author_id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "rappeloids.app/User"
  ];
  string author_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string text = 4 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListTripsRequest {
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListTripsResponse {
  repeated Trip trips = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message GetTripRequest {
  // Format: "trips/{trip_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];
}

message CreateTripRequest {
  string trip_id = 1 [(google.api.field_behavior) = OPTIONAL];
  Trip trip = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateTripRequest {
  Trip trip = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteTripRequest {
  // Format: "trips/{trip_id}"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "rappeloids.app/Trip"
  ];
}
